[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dragkraft"
version = "0.1.0"
description = "Dragkraft train performance simulation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dash",
  "matplotlib",
  "numpy",
  "openpyxl",
  "pandas",
  "plotly",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dragkraft*"]
